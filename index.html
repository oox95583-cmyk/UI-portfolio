<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>刘畅 UI 设计作品集</title>
    <link rel="preload" as="image" href="./assets/cover.webp" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <section
        id="cover"
        class="hero hero--cover"
        style="
          --screen-bg: #85bef1;
          --screen-wash: transparent;
          --screen-image: url('./assets/cover.webp');
          --screen-left: url('./assets/catalog-extend-left.webp');
          --screen-right: url('./assets/catalog-extend-right.webp');
          --screen-top: url('./assets/extend-top.webp');
          --screen-bottom: url('./assets/extend-bottom.webp');
          --screen-backdrop-filter: blur(72px) saturate(0.52) brightness(1.02);
          --screen-backdrop-opacity: 0;
          --screen-bridge-filter: blur(4px) saturate(0.52) brightness(1.08);
          --screen-bridge-opacity: 0.2;
          --screen-bridge-overlay-top: rgba(246, 251, 255, 0.66);
          --screen-bridge-overlay-bottom: rgba(237, 246, 254, 0.56);
          --screen-fill-filter: blur(2px) saturate(0.46) brightness(1.14) contrast(0.92);
          --screen-fill-opacity: 0.31;
          --screen-fill-overlay-top: rgba(246, 251, 255, 0.9);
          --screen-fill-overlay-bottom: rgba(235, 246, 254, 0.82);
        "
        aria-label="刘畅 UI 设计作品集首屏封面，基于提供图片按 16 比 9 比例还原"
      >
        <div class="hero-stage">
          <div class="hero-main">
            <div class="hero-fill hero-fill-left" aria-hidden="true"></div>
            <div class="hero-fill hero-fill-right" aria-hidden="true"></div>
            <div class="hero-fill hero-fill-top" aria-hidden="true"></div>
            <div class="hero-fill hero-fill-bottom" aria-hidden="true"></div>
            <div class="hero-bridge hero-bridge-left" aria-hidden="true"></div>
            <div class="hero-bridge hero-bridge-right" aria-hidden="true"></div>
            <div class="hero-cover-motion" aria-hidden="true">
              <div class="hero-motion hero-motion-character"></div>
              <div class="hero-motion hero-motion-face"></div>
              <div class="hero-motion hero-motion-fingers"></div>
              <div class="hero-motion hero-motion-top-hand"></div>
            </div>
            <img
              class="hero-image"
              src="./assets/cover.webp"
              alt="2025-2026 设计作品归纳个人首屏封面"
              decoding="async"
              fetchpriority="high"
            />
          </div>
        </div>
      </section>

      <section
        id="about"
        class="hero hero--about"
        style="
          --screen-bg: #85bef1;
          --screen-wash: transparent;
          --screen-image: url('./assets/about.webp');
          --screen-left: url('./assets/catalog-extend-left.webp');
          --screen-right: url('./assets/catalog-extend-right.webp');
          --screen-top: url('./assets/about-extend-top.webp');
          --screen-bottom: url('./assets/about-extend-bottom.webp');
          --screen-backdrop-filter: blur(72px) saturate(0.52) brightness(1.02);
          --screen-backdrop-opacity: 0;
          --screen-bridge-filter: blur(4px) saturate(0.52) brightness(1.08);
          --screen-bridge-opacity: 0.2;
          --screen-bridge-overlay-top: rgba(246, 251, 255, 0.66);
          --screen-bridge-overlay-bottom: rgba(237, 246, 254, 0.56);
          --screen-fill-filter: blur(2px) saturate(0.46) brightness(1.14) contrast(0.92);
          --screen-fill-opacity: 0.31;
          --screen-fill-overlay-top: rgba(246, 251, 255, 0.9);
          --screen-fill-overlay-bottom: rgba(235, 246, 254, 0.82);
      "
        aria-label="刘畅 UI 设计作品集第二屏自我介绍，基于提供图片按 16 比 9 比例还原"
      >
        <div class="hero-stage">
          <div class="hero-main">
            <div class="hero-fill hero-fill-left" aria-hidden="true"></div>
            <div class="hero-fill hero-fill-right" aria-hidden="true"></div>
            <div class="hero-fill hero-fill-top" aria-hidden="true"></div>
            <div class="hero-fill hero-fill-bottom" aria-hidden="true"></div>
            <div class="hero-bridge hero-bridge-left" aria-hidden="true"></div>
            <div class="hero-bridge hero-bridge-right" aria-hidden="true"></div>
            <img
              class="hero-image"
              src="./assets/about.webp"
              alt="刘畅个人简介下一屏"
              loading="lazy"
              decoding="async"
            />
          </div>
        </div>
      </section>

      <section
        id="catalog"
        class="hero hero--catalog"
        style="
          --screen-bg: #85bef1;
          --screen-wash: transparent;
          --screen-image: url('./assets/catalog-v2.webp');
          --screen-left: url('./assets/catalog-extend-left.webp');
          --screen-right: url('./assets/catalog-extend-right.webp');
          --screen-top: url('./assets/catalog-extend-top.webp');
          --screen-bottom: url('./assets/catalog-extend-bottom.webp');
          --screen-backdrop-filter: blur(72px) saturate(0.52) brightness(1.02);
          --screen-backdrop-opacity: 0;
          --screen-bridge-filter: blur(4px) saturate(0.52) brightness(1.08);
          --screen-bridge-opacity: 0.2;
          --screen-bridge-overlay-top: rgba(246, 251, 255, 0.66);
          --screen-bridge-overlay-bottom: rgba(237, 246, 254, 0.56);
          --screen-fill-filter: blur(2px) saturate(0.46) brightness(1.14) contrast(0.92);
          --screen-fill-opacity: 0.31;
          --screen-fill-overlay-top: rgba(246, 251, 255, 0.9);
          --screen-fill-overlay-bottom: rgba(235, 246, 254, 0.82);
      "
        aria-label="刘畅 UI 设计作品集第三屏目录展示，基于提供图片按 16 比 9 比例还原"
      >
        <div class="hero-stage">
          <div class="hero-main">
            <div class="hero-fill hero-fill-left" aria-hidden="true"></div>
            <div class="hero-fill hero-fill-right" aria-hidden="true"></div>
            <div class="hero-fill hero-fill-top" aria-hidden="true"></div>
            <div class="hero-fill hero-fill-bottom" aria-hidden="true"></div>
            <div class="hero-bridge hero-bridge-left" aria-hidden="true"></div>
            <div class="hero-bridge hero-bridge-right" aria-hidden="true"></div>
            <img
              class="hero-image"
              src="./assets/catalog-v2.webp"
              alt="刘畅目录展示页"
              loading="lazy"
              decoding="async"
            />
            <div class="catalog-projects" aria-label="目录展示项目 hover 高亮区域">
              <a
                class="catalog-project catalog-project--link"
                href="./projects/good-doctor.html"
                style="
                  --x: 2.395833%;
                  --y: 42.222222%;
                  --w: 21.25%;
                  --h: 21.296296%;
                "
                aria-label="查看 C端 好医师AI问诊 项目详情"
              >
                <span class="catalog-project__image-frame" aria-hidden="true"></span>
              </a>
              <a
                class="catalog-project catalog-project--link"
                href="./projects/resource-platform.html"
                style="
                  --x: 27.03125%;
                  --y: 42.222222%;
                  --w: 21.25%;
                  --h: 21.296296%;
                "
                aria-label="查看 B端 杰狮资源一体化 项目详情"
              >
                <span class="catalog-project__image-frame" aria-hidden="true"></span>
              </a>
              <a
                class="catalog-project catalog-project--link"
                href="./projects/dashboard.html"
                style="
                  --x: 51.71875%;
                  --y: 42.222222%;
                  --w: 21.25%;
                  --h: 21.296296%;
                "
                aria-label="查看 G端 自然资源驾驶舱 项目详情"
              >
                <span class="catalog-project__image-frame" aria-hidden="true"></span>
              </a>
              <a
                class="catalog-project catalog-project--link"
                href="./projects/aigc-marketing.html"
                style="
                  --x: 76.354167%;
                  --y: 42.222222%;
                  --w: 21.25%;
                  --h: 21.296296%;
                "
                aria-label="查看 AIGC 营销视觉落地 项目详情"
              >
                <span class="catalog-project__image-frame" aria-hidden="true"></span>
              </a>
            </div>
            <div class="catalog-project-titles">
              <svg class="catalog-title-filter-defs" width="0" height="0">
                <defs>
                  <filter
                    id="catalog-title-blue-filter"
                    x="0"
                    y="0"
                    width="100%"
                    height="100%"
                    color-interpolation-filters="sRGB"
                  >
                    <feColorMatrix
                      in="SourceGraphic"
                      type="luminanceToAlpha"
                      result="title-luminance"
                    />
                    <feComponentTransfer in="title-luminance" result="title-mask">
                      <feFuncA
                        type="table"
                        tableValues="1 1 1 0.99 0.925 0.863 0.8 0.737 0.674 0.611 0.548 0.485 0.423 0.36 0.297 0.234 0 0 0 0 0"
                      />
                    </feComponentTransfer>
                    <feMorphology
                      in="title-mask"
                      operator="dilate"
                      radius="2.2"
                      result="title-mask-bold"
                    />
                    <feFlood flood-color="#0a82ec" result="title-blue" />
                    <feComposite
                      in="title-blue"
                      in2="title-mask-bold"
                      operator="in"
                    />
                  </filter>
                </defs>
              </svg>
              <a
                class="catalog-project-title-hit"
                href="./projects/good-doctor.html"
                aria-label="查看 C端 好医师AI问诊 项目详情"
                style="
                  --title-x: 2.430556%;
                  --title-y: 67.345679%;
                  --title-w: 17.743056%;
                  --title-h: 3.919753%;
                "
              ></a>
              <svg
                class="catalog-project-title"
                style="
                  --clip-top: 67.345679%;
                  --clip-right: 79.826388%;
                  --clip-bottom: 28.734568%;
                  --clip-left: 2.430556%;
                "
                viewBox="0 0 5760 3240"
                preserveAspectRatio="none"
              >
                <image
                  href="./assets/catalog-v2.webp"
                  width="5760"
                  height="3240"
                  filter="url(#catalog-title-blue-filter)"
                />
              </svg>
              <a
                class="catalog-project-title-hit"
                href="./projects/resource-platform.html"
                aria-label="查看 B端 杰狮资源一体化 项目详情"
                style="
                  --title-x: 27.100694%;
                  --title-y: 67.345679%;
                  --title-w: 19.722222%;
                  --title-h: 3.950617%;
                "
              ></a>
              <svg
                class="catalog-project-title"
                style="
                  --clip-top: 67.345679%;
                  --clip-right: 53.177084%;
                  --clip-bottom: 28.703704%;
                  --clip-left: 27.100694%;
                "
                viewBox="0 0 5760 3240"
                preserveAspectRatio="none"
              >
                <image
                  href="./assets/catalog-v2.webp"
                  width="5760"
                  height="3240"
                  filter="url(#catalog-title-blue-filter)"
                />
              </svg>
              <a
                class="catalog-project-title-hit"
                href="./projects/dashboard.html"
                aria-label="查看 G端 自然资源驾驶舱 项目详情"
                style="
                  --title-x: 51.753472%;
                  --title-y: 67.345679%;
                  --title-w: 19.913194%;
                  --title-h: 3.950617%;
                "
              ></a>
              <svg
                class="catalog-project-title"
                style="
                  --clip-top: 67.345679%;
                  --clip-right: 28.333334%;
                  --clip-bottom: 28.703704%;
                  --clip-left: 51.753472%;
                "
                viewBox="0 0 5760 3240"
                preserveAspectRatio="none"
              >
                <image
                  href="./assets/catalog-v2.webp"
                  width="5760"
                  height="3240"
                  filter="url(#catalog-title-blue-filter)"
                />
              </svg>
              <a
                class="catalog-project-title-hit"
                href="./projects/aigc-marketing.html"
                aria-label="查看 AIGC 营销视觉落地 项目详情"
                style="
                  --title-x: 76.302083%;
                  --title-y: 67.345679%;
                  --title-w: 19.513889%;
                  --title-h: 3.919753%;
                "
              ></a>
              <svg
                class="catalog-project-title"
                style="
                  --clip-top: 67.345679%;
                  --clip-right: 4.184028%;
                  --clip-bottom: 28.734568%;
                  --clip-left: 76.302083%;
                "
                viewBox="0 0 5760 3240"
                preserveAspectRatio="none"
              >
                <image
                  href="./assets/catalog-v2.webp"
                  width="5760"
                  height="3240"
                  filter="url(#catalog-title-blue-filter)"
                />
              </svg>
            </div>
          </div>
        </div>
      </section>

      <section
        id="back-cover"
        class="hero hero--back-cover"
        style="
          --screen-bg: #85bef1;
          --screen-wash: transparent;
          --screen-image: url('./assets/back-cover-hq.webp');
          --screen-left: url('./assets/catalog-extend-left.webp');
          --screen-right: url('./assets/catalog-extend-right.webp');
          --screen-top: url('./assets/back-cover-extend-top.webp');
          --screen-bottom: url('./assets/back-cover-extend-bottom.webp');
          --screen-backdrop-filter: blur(72px) saturate(0.52) brightness(1.02);
          --screen-backdrop-opacity: 0;
          --screen-bridge-filter: blur(4px) saturate(0.52) brightness(1.08);
          --screen-bridge-opacity: 0.2;
          --screen-bridge-overlay-top: rgba(246, 251, 255, 0.66);
          --screen-bridge-overlay-bottom: rgba(237, 246, 254, 0.56);
          --screen-fill-filter: blur(2px) saturate(0.46) brightness(1.14) contrast(0.92);
          --screen-fill-opacity: 0.31;
          --screen-fill-overlay-top: rgba(246, 251, 255, 0.9);
          --screen-fill-overlay-bottom: rgba(235, 246, 254, 0.82);
      "
        aria-label="刘畅 UI 设计作品集第四屏封底与联系方式，基于提供图片按 16 比 9 比例还原"
      >
        <div class="hero-stage">
          <div class="hero-main">
            <div class="hero-fill hero-fill-left" aria-hidden="true"></div>
            <div class="hero-fill hero-fill-right" aria-hidden="true"></div>
            <div class="hero-fill hero-fill-top" aria-hidden="true"></div>
            <div class="hero-fill hero-fill-bottom" aria-hidden="true"></div>
            <div class="hero-bridge hero-bridge-left" aria-hidden="true"></div>
            <div class="hero-bridge hero-bridge-right" aria-hidden="true"></div>
            <img
              class="hero-image"
              src="./assets/back-cover-hq.webp"
              alt="刘畅 UI 设计作品集封底与微信联系方式"
              loading="lazy"
              decoding="async"
            />
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
